version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercur_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mercur_db
    ports:
      - "5438:5432"
    volumes:
      - mercur_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercur_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mercur_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - mercur_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mercur_pgdata:
  mercur_redisdata:
