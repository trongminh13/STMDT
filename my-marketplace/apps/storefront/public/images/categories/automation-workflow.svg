      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="glowAuto" x1="100" y1="100" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgAuto)"/>
  <circle cx="200" cy="200" r="140" stroke="#312E81" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Connecting Lines -->
  <path d="M130 160L200 240L270 160" stroke="url(#glowAuto)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
